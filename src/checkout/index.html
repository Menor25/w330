<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review &amp; Place your Order</h2>

        <div class="checkout-container">
          <form id="checkout-form" class="checkout-form">

            <fieldset class="form-section">
              <legend>Customer Name</legend>
              <div class="form-row">
                <div class="form-group">
                  <label for="fname">First Name</label>
                  <input type="text" id="fname" name="fname" required />
                </div>
                <div class="form-group">
                  <label for="lname">Last Name</label>
                  <input type="text" id="lname" name="lname" required />
                </div>
              </div>
            </fieldset>

            <fieldset class="form-section">
              <legend>Address</legend>
              <div class="form-group">
                <label for="street">Street Address</label>
                <input type="text" id="street" name="street" required />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="city">City</label>
                  <input type="text" id="city" name="city" required />
                </div>
                <div class="form-group">
                  <label for="state">State</label>
                  <input type="text" id="state" name="state" maxlength="2" required />
                </div>
                <div class="form-group">
                  <label for="zip">Zip Code</label>
                  <input type="text" id="zip" name="zip" maxlength="5" pattern="\d{5}" required />
                </div>
              </div>
            </fieldset>

            <fieldset class="form-section">
              <legend>Payment</legend>
              <div class="form-group">
                <label for="cardNumber">Credit Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" maxlength="16" pattern="\d{16}" placeholder="16-digit card number" required />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="expiration">Expiration Date</label>
                  <input type="text" id="expiration" name="expiration" placeholder="MM/YY" pattern="\d{1,2}/\d{2}" required />
                </div>
                <div class="form-group">
                  <label for="code">Security Code</label>
                  <input type="text" id="code" name="code" maxlength="3" pattern="\d{3}" placeholder="CVV" required />
                </div>
              </div>
            </fieldset>

            <button type="submit" class="checkout-submit">Place Order</button>
          </form>

          <aside class="order-summary">
            <h3>Order Summary</h3>
            <dl class="summary-list">
              <dt>Subtotal</dt>
              <dd id="subtotal">$0.00</dd>
              <dt>Tax (6%)</dt>
              <dd id="tax">Calculated after zip</dd>
              <dt>Shipping</dt>
              <dd id="shipping">Calculated after zip</dd>
              <dt class="summary-total-label">Order Total</dt>
              <dd id="order-total" class="summary-total-value">—</dd>
            </dl>
          </aside>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
