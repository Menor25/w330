<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <form id="checkoutForm" class="checkout-form">
        <fieldset>
          <legend>Contact Information</legend>
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" pattern="[0-9\-\s()+]{7,}" required />
        </fieldset>

        <fieldset>
          <legend>Shipping Address</legend>
          <label for="address">Address</label>
          <input id="address" name="address" required />

          <label for="city">City</label>
          <input id="city" name="city" required />

          <label for="state">State</label>
          <input id="state" name="state" required />

          <label for="zip">Postal Code</label>
          <input id="zip" name="zip" pattern="\d{5}(-\d{4})?" required />
        </fieldset>

        <fieldset>
          <legend>Payment</legend>
          <label for="card">Card Number</label>
          <input id="card" name="card" inputmode="numeric" pattern="[0-9 ]{12,19}" required />

          <label for="exp">Expiry (MM/YY)</label>
          <input id="exp" name="exp" pattern="(0[1-9]|1[0-2])\/(\d{2})" required />

          <label for="cvc">CVC</label>
          <input id="cvc" name="cvc" inputmode="numeric" pattern="\d{3,4}" required />
        </fieldset>

        <div class="form-actions">
          <button id="checkoutSubmit">Place Order</button>
        </div>
      </form>

    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
