<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <form id="checkoutForm" class="checkout-form">

        <fieldset>
          <legend>Customer Information</legend>

          <label>First Name</label>
          <input name="fname" required />

          <label>Last Name</label>
          <input name="lname" required />
        </fieldset>

        <fieldset>
          <legend>Shipping Address</legend>

          <label>Street</label>
          <input name="street" required />

          <label>City</label>
          <input name="city" required />

          <label>State</label>
          <input name="state" required />

          <label>Zip</label>
          <input name="zip" required pattern="\d{5}(-\d{4})?" />
        </fieldset>

        <fieldset>
          <legend>Payment</legend>

          <label>Card Number</label>
          <input name="cardNumber" required pattern="[0-9 ]{12,19}" inputmode="numeric" />

          <label>Expiration (MM/YY)</label>
          <input name="expiration" required pattern="(0[1-9]|1[0-2])\/\d{2}" />

          <label>Security Code</label>
          <input name="code" required pattern="\d{3,4}" inputmode="numeric" />
        </fieldset>

        <div class="form-actions">
          <button id="checkoutSubmit" type="submit">Place Order</button>
        </div>

      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
