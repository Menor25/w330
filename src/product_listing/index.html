<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Products</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/product-listing.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <div class="products__header">
          <h2 id="category-title">Products</h2>

          <h2>Top Products</h2>
          <select id="sort-products">
            <option value="default">Sort by</option>
            <option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </div>
        <ul class="product-list"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="/js/product-listing.js"></script>
  </body>
</html>
